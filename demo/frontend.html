<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mesh-ПВЗ · MVP</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f3f0fb;
        --sf: #fff;
        --tx: #1b1233;
        --mu: #6a6188;
        --bd: #ded7f2;
        --ac: #6d28d9;
        --ac2: #d61f8c;
        --ok: #0f7a55;
        --wn: #a85a00;
        --er: #c4183f;
        --sf2: #ece7fa;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #120c22;
          --sf: #1c1432;
          --tx: #efeaff;
          --mu: #a094c4;
          --bd: #34284f;
          --ac: #a78bfa;
          --ac2: #f472b6;
          --ok: #4ade80;
          --wn: #fbbf24;
          --er: #fb7185;
          --sf2: #261b42;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #120c22;
        --sf: #1c1432;
        --tx: #efeaff;
        --mu: #a094c4;
        --bd: #34284f;
        --ac: #a78bfa;
        --ac2: #f472b6;
        --ok: #4ade80;
        --wn: #fbbf24;
        --er: #fb7185;
        --sf2: #261b42;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 Onest,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--sf);
        border-bottom: 1px solid var(--bd);
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        padding: 10px 16px;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--sf);
        z-index: 6;
      }
      .brand {
        font-weight: 800;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .brand i {
        font-style: normal;
        color: var(--ac2);
      }
      .seg {
        display: flex;
        background: var(--sf2);
        border-radius: 10px;
        padding: 3px;
      }
      .seg button {
        border: 0;
        background: none;
        color: var(--mu);
        font: inherit;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 8px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--ac);
        color: #fff;
      }
      button,
      select,
      input {
        font: inherit;
        color: var(--tx);
      }
      .b {
        border: 1px solid var(--bd);
        background: var(--sf);
        border-radius: 9px;
        padding: 6px 12px;
        cursor: pointer;
        font-weight: 500;
      }
      .b:hover {
        border-color: var(--ac);
      }
      .b.p {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        font-weight: 700;
      }
      .b.d {
        color: var(--er);
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--ac2);
        outline-offset: 2px;
      }
      .sp {
        flex: 1;
      }
      .clock {
        font-variant-numeric: tabular-nums;
        color: var(--mu);
        font-size: 13px;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--bd);
        margin-bottom: 16px;
        overflow-x: auto;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 8px 14px;
        color: var(--mu);
        font-weight: 700;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }
      .tabs button.on {
        color: var(--tx);
        border-color: var(--ac2);
      }
      .g {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
      .c {
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
      }
      .c h3 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: end;
        margin-bottom: 10px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12px;
        color: var(--mu);
        font-weight: 500;
      }
      select,
      input {
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 7px 9px;
        min-width: 90px;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th {
        text-align: left;
        color: var(--mu);
        font-weight: 500;
        font-size: 12px;
      }
      td,
      th {
        padding: 7px 8px;
        border-bottom: 1px solid var(--bd);
        vertical-align: middle;
      }
      .chip {
        display: inline-block;
        padding: 1px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
        background: var(--sf2);
        color: var(--mu);
        white-space: nowrap;
      }
      .chip.ok {
        color: var(--ok);
      }
      .chip.wn {
        color: var(--wn);
      }
      .chip.er {
        color: var(--er);
      }
      .chip.ac {
        background: var(--ac);
        color: #fff;
      }
      .stub {
        border: 1px dashed var(--wn);
        color: var(--wn);
        background: none;
      }
      .big {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
      }
      .bar {
        height: 9px;
        background: var(--sf2);
        border-radius: 9px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--ac), var(--ac2));
      }
      .v {
        border: 2px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
        background: var(--sf);
      }
      .v.win {
        border-color: var(--ac2);
      }
      .v.no {
        opacity: 0.55;
      }
      .route {
        display: flex;
        align-items: flex-start;
        margin: 12px 0 4px;
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .nd {
        min-width: 84px;
        text-align: center;
        font-size: 12px;
        position: relative;
      }
      .nd::before {
        content: '';
        display: block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--ac);
        margin: 0 auto 4px;
        position: relative;
        z-index: 1;
      }
      .nd.h::before {
        background: none;
        border: 3px dashed var(--wn);
      }
      .nd.e::before {
        background: var(--ac2);
      }
      .nd:not(:last-child)::after {
        content: '';
        position: absolute;
        top: 6px;
        left: 50%;
        width: 100%;
        height: 3px;
        background: var(--bd);
      }
      .nd small {
        display: block;
        color: var(--mu);
      }
      .msg {
        padding: 9px 12px;
        border-radius: 10px;
        margin-bottom: 12px;
        background: var(--sf2);
        font-weight: 500;
      }
      .msg.er {
        color: var(--er);
      }
      .msg.ok {
        color: var(--ok);
      }
      .con {
        margin-top: 20px;
        background: var(--sf);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 10px 14px;
      }
      .con summary {
        cursor: pointer;
        font-weight: 700;
      }
      .cov {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 10px 0;
      }
      .cov span {
        font:
          11px ui-monospace,
          Menlo,
          monospace;
        padding: 2px 7px;
        border-radius: 6px;
        border: 1px solid var(--bd);
        color: var(--mu);
      }
      .cov span.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .lg {
        font:
          12px/1.6 ui-monospace,
          Menlo,
          monospace;
        max-height: 220px;
        overflow: auto;
        color: var(--mu);
      }
      .lg b.e {
        color: var(--er);
      }
      .lg b.k {
        color: var(--ok);
      }
      .st {
        display: flex;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--bd);
        font-size: 14px;
      }
      .st .m {
        width: 20px;
        font-weight: 800;
      }
      .ok-t {
        color: var(--ok);
      }
      .er-t {
        color: var(--er);
      }
      @media (prefers-reduced-motion: no-preference) {
        .bar i {
          transition: width 0.4s;
        }
      }
      .order-financials {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 25px;
      }
      .order-financials dt {
        color: var(--mu);
        font-size: 13px;
      }
      .order-financials dd {
        margin: 3px 0 0;
        font-weight: 700;
      }
      .workspace-heading {
        margin: 12px 0 24px;
      }
      .workspace-heading h1 {
        font-size: clamp(28px, 5vw, 42px);
        line-height: 1.1;
        margin: 0 0 8px;
      }
      .workspace-heading p {
        margin: 0;
      }
      .screen-tag {
        margin-bottom: 8px;
      }
      .c {
        min-width: 0;
      }
      .route {
        overflow-wrap: anywhere;
      }
      @media (max-width: 600px) {
        header {
          position: static;
        }
        header .sp {
          display: none;
        }
        .seg {
          max-width: 100%;
        }
        .seg button {
          padding-inline: 9px;
        }
        main {
          padding: 12px;
        }
        .tw {
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Mesh<i>·</i>ПВЗ</div>
      <div class="seg" id="roles"></div>
      <span class="chip stub" title="Хаб, магистраль, покупатель, платёжный шлюз"
        >заглушки: хаб · магистраль · покупатель</span
      >
      <div class="sp"></div>
      <span class="clock" id="clock"></span>
      <button class="b" data-a="adv" data-d="1">+1 день</button
      ><button class="b" data-a="adv" data-d="10">+10 дней</button>
      <button class="b d" data-a="reset">Сброс демо</button>
    </header>
    <main>
      <div id="msg" role="status" aria-live="polite"></div>
      <div id="app"></div>
      <details class="con">
        <summary id="csum"></summary>
        <div class="cov" id="cov"></div>
        <div class="lg" id="lg"></div>
        <div class="row" style="margin: 10px 0 0">
          <button class="b" data-a="nokey">Тест: POST без Idempotency-Key</button
          ><button class="b" data-a="health">GET /health</button>
        </div>
      </details>
      <p class="mu">
        Тарифы и пороги в демо — допущение, не тариф RWB. Покупатель, оплата, хаб и магистраль в
        демо представлены заглушками.
      </p>
    </main>
    <script>
      const uid = () => {
          const bytes = crypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 15) | 64;
          bytes[8] = (bytes[8] & 63) | 128;
          const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
          return hex.replace(/^(........)(....)(....)(....)(............)$/, '$1-$2-$3-$4-$5');
        },
        sh = (i) => (i ? String(i).slice(0, 8) : '—');
      const rub = (n) =>
        (Math.round(n * 100) / 100).toLocaleString('ru-RU', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }) + ' ₽';
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      const $ = (s) => document.querySelector(s),
        T0 = Date.parse('2026-11-25T10:00:00Z'),
        DAY = 864e5;
      let DB,
        UI = {
          role: 'S',
          pvz: null,
          tab: { S: 'order', P: 'orders', X: 'run' },
          log: [],
          used: new Set(),
          f: { qty: 2, intakeQty: 2, pref: 'COST' },
          itemDraft: { name: '', kg: '0.3', vol: '0.003', price: '900', cogs: '' },
          q: null,
          sel: null,
          keys: {},
          scen: null,
          msg: null,
        };
      function setBusy(value) {
        busy = value;
        $('#app').setAttribute('aria-busy', String(value));
        document.querySelectorAll('button, input, select').forEach((control) => {
          if (value && !control.disabled) {
            control.disabled = true;
            control.dataset.pending = '';
          } else if (!value && 'pending' in control.dataset) {
            control.disabled = false;
            delete control.dataset.pending;
          }
        });
      }
      const now = () => DB.serverTime ?? T0 + DB.off,
        E = (c, m) => Object.assign(new Error(m), { code: c });
      const pv = (id) => DB.pvz.find((p) => p.id === id),
        it = (id) => DB.items.find((i) => i.id === id);
      const od = (id) => {
        const o = DB.orders.find((o) => o.id === id);
        if (!o) throw E(404, 'Заказ не найден');
        return o;
      };
      const load = (id) =>
        DB.batches.filter((b) => b.pvz === id).reduce((s, b) => s + b.qty, 0) +
        DB.orders
          .filter(
            (o) =>
              o.target === id &&
              (o.status === 'ASSEMBLED' || (o.status === 'CREATED' && o.source_pvz_id !== id)),
          )
          .reduce((s, o) => s + o.qty, 0);
      const led = (kind, pvz, amt, why, oid) =>
        DB.ledger.push({ t: now(), kind, pvz, amt, why, oid });
      const note = (type, pvz, text) => DB.notes.unshift({ t: now(), type, pvz, text });
      const km = (a, b) =>
        Math.hypot(
          (a.lat - b.lat) * 111,
          (a.lng - b.lng) * 111 * Math.cos((a.lat * Math.PI) / 180),
        );
      const sum = (a, f) => a.reduce((s, x) => s + f(x), 0),
        fd = (t) => new Date(t).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
      function seed() {
        const C = {
          m: { id: uid(), name: 'Москва', code: 'MSK' },
          s: { id: uid(), name: 'Санкт-Петербург', code: 'SPB' },
        };
        const mk = (c, n, a, lat, lng, cap, fi, fa, fis, fs) => ({
          id: uid(),
          city: C[c].id,
          name: n,
          address: a,
          lat,
          lng,
          cap,
          fi,
          fa,
          fis,
          fs,
          active: true,
        });
        const pvz = [
          mk('m', 'ПВЗ Москва-1', 'Тверская, 7', 55.76, 37.61, 100, 4, 18, 12, 1.5),
          mk('m', 'ПВЗ Москва-2', 'Арбат, 20', 55.75, 37.59, 60, 5, 20, 14, 1.8),
          mk('m', 'ПВЗ Москва-3', 'Ленинский пр., 90', 55.69, 37.53, 30, 4, 16, 10, 1.2),
          mk('s', 'ПВЗ СПб-1', 'Невский пр., 50', 59.93, 30.34, 80, 4, 17, 11, 1.4),
        ];
        const items = [
          { id: uid(), name: 'Кружка', kg: 0.4, vol: 0.002, price: 450 },
          { id: uid(), name: 'Плед', kg: 1.2, vol: 0.012, price: 1900 },
          { id: uid(), name: 'Куртка', kg: 1.5, vol: 0.03, price: 4200 },
        ];
        const bt = (i, p, q, d) => ({
          id: uid(),
          item: items[i].id,
          pvz: pvz[p].id,
          qty: q,
          res: 0,
          at: T0 - d * DAY,
          chg: T0 - d * DAY,
        });
        DB = {
          off: 0,
          cities: Object.values(C),
          pvz: pvz,
          hubs: [
            { id: uid(), city: C.m.id, name: 'Хаб Москва', is_stub: true },
            { id: uid(), city: C.s.id, name: 'Хаб СПб', is_stub: true },
          ],
          seller: { id: uid(), name: 'ИП Орлов' },
          items,
          batches: [
            bt(0, 0, 40, 1),
            bt(0, 1, 15, 1),
            bt(0, 3, 20, 1),
            bt(1, 0, 10, 1),
            bt(1, 3, 5, 1),
            bt(1, 2, 26, 1),
            bt(2, 0, 30, 1),
          ],
          orders: [],
          ledger: [],
          notes: [],
          idem: new Map(),
          incidents: [],
        };
        UI.pvz = pvz[0].id;
        UI.f = {
          qty: 2,
          intakeQty: 2,
          pref: 'COST',
          item: items[0].id,
          intakeItem: items[0].id,
          tgt: pvz[2].id,
        };
        UI.keys = {};
        UI.q = null;
        UI.sel = null;
      }
      function quote(i, qty, t) {
        const ch = Math.max(i.kg * qty, i.vol * qty * 250);
        const c = DB.batches
          .filter((b) => b.item === i.id && b.qty - b.res >= qty && pv(b.pvz).active)
          .map((b) => ({ b, d: km(pv(b.pvz), t) }))
          .sort((x, y) => x.d - y.d)[0];
        if (!c) throw E(409, 'Нет партии с остатком ' + qty + ' ед. ни на одном ПВЗ');
        const sp = pv(c.b.pvz),
          same = sp.city === t.city,
          d = Math.max(c.d, 0.5),
          full = !t.active || load(t.id) + (sp.id === t.id ? 0 : qty) > t.cap,
          blk = !t.active
            ? 'Целевой ПВЗ недоступен'
            : 'Целевой ПВЗ заполнен (' + load(t.id) + '/' + t.cap + ')';
        const hf = call('POST', '/stub/hub/handle', { chargeable_kg: ch }, uid()).data.hub_fee,
          tr = call(
            'POST',
            '/stub/trunk/move',
            { chargeable_kg: ch, km: same ? 12 : d },
            uid(),
          ).data;
        const mc = 20 + ch * d * 0.35,
          mh = 3 + d / 40;
        const mesh = {
          scheme: 'MESH',
          cost: mc,
          hours: mh,
          ok: !full && same,
          why: full
            ? blk
            : !same
              ? 'Прямой рейс доступен только внутри города'
              : 'прямая доставка между ПВЗ',
          segs: [
            { n: sp.name, l: 'партия' },
            { n: t.name, l: rub(mc) + ' · ' + mh.toFixed(1) + ' ч', e: 1 },
          ],
        };
        const hc = 18 + hf.total + tr.cost + 25,
          hh = 4 + 6 + tr.hours + 3;
        const hub = {
          scheme: 'HUB_TRUNK',
          cost: hc,
          hours: hh,
          ok: !full,
          why: full ? blk : 'через хаб и магистраль',
          segs: [
            { n: sp.name, l: 'партия' },
            { n: 'Хаб', l: 'заглушка · ' + rub(hf.total), h: 1 },
            {
              n: 'Магистраль',
              l: 'заглушка · ' + rub(tr.cost) + ' · ' + tr.hours.toFixed(1) + ' ч',
              h: 1,
            },
            { n: t.name, l: 'последняя миля ' + rub(25), e: 1 },
          ],
        };
        return {
          mesh,
          hub,
          src: c.b,
          srcName: sp.name,
          ch,
          same,
          block:
            blk +
            (full
              ? '. Свободные ПВЗ города: ' +
                (DB.pvz
                  .filter(
                    (p) =>
                      p.active &&
                      p.city === t.city &&
                      p.id !== t.id &&
                      load(p.id) + (p.id === sp.id ? 0 : qty) <= p.cap,
                  )
                  .map((p) => p.name)
                  .join(', ') || 'нет')
              : ''),
        };
      }
      function createOrder(b) {
        const i = it(b.item_id),
          t = pv(b.target_pvz_id),
          qty = +b.qty;
        if (!i || !t || !Number.isSafeInteger(qty) || qty < 1)
          throw E(422, 'Проверьте товар, ПВЗ и количество');
        const q = quote(i, qty, t),
          pref = b.preference === 'TIME' ? 'TIME' : 'COST',
          ok = [q.mesh, q.hub].filter((v) => v.ok);
        if (!ok.length) throw E(409, q.block);
        const ch = [...ok].sort((a, c) =>
            pref === 'COST' ? a.cost - c.cost : a.hours - c.hours,
          )[0],
          alt = ok.find((v) => v !== ch),
          oth = ch === q.mesh ? q.hub : q.mesh;
        const reason = alt

      const apiBase = new URLSearchParams(location.search).get('api')?.trim().replace(/\/+$/, '');
      let busy = false;
      let screenError = '';
      let screenData = new Map();
      const pendingKeys = new Map();

      const cacheKey = (path, query = {}) => path + '?' + new URLSearchParams(query);
      function read(method, path, query = {}) {
        if (!apiBase) return call(method, path, query).data;
        const key = cacheKey(path, query);
        if (!screenData.has(key)) throw Error('Данные экрана недоступны. Обновите страницу.');
        return screenData.get(key);
      }

      async function request(method, path, payload = {}) {
        const url = new URL(apiBase + path, location.href);
        if (!['http:', 'https:'].includes(url.protocol)) throw Error('Укажите HTTP-адрес API.');
        const headers = { Accept: 'application/json' };
        const body = method === 'POST' ? JSON.stringify(payload) : undefined;
        const signature = path + ' ' + body;
        if (body) {
          headers['Content-Type'] = 'application/json';
          if (path !== '/items') {
            if (!pendingKeys.has(signature)) pendingKeys.set(signature, uid());
            headers['Idempotency-Key'] = pendingKeys.get(signature);
          }
        } else {
          url.search = new URLSearchParams(payload).toString();
        }
        let response;
        try {
          response = await fetch(url, {
            method,
            headers,
            body,
            signal: AbortSignal.timeout(10000),
          });
        } catch {
          throw Error(
            'Сервер недоступен. Проверьте адрес API и настройки CORS. Повтор операции сохранит её ключ.',
          );
        }
        if (
          response.status >= 400 &&
          response.status < 500 &&
          ![408, 425, 429].includes(response.status)
        )
          pendingKeys.delete(signature);
        UI.log.unshift({
          t: new Date().toLocaleTimeString('ru-RU'),
          ep: method,
          path,
          st: response.status,
          key: headers['Idempotency-Key'],
        });
        UI.log.length = Math.min(UI.log.length, 60);
        if (response.ok) UI.used.add(method + ' ' + path.replace(/\/(?:(?:[0-9a-f-]{36})|\d{8})(?=\/|$)/g, '/{id}'));
        if (response.status === 204 && method === 'POST') {
          pendingKeys.delete(signature);
          return null;
        }
        const result = await response.json().catch(() => null);
        if (!response.ok) {
          const reason = result?.error ?? result?.detail ?? result?.message;
          const error = Error(
            `${method} ${path} · HTTP ${response.status}${typeof reason === 'string' ? ' · ' + reason : ''}`,
          );
          if (response.status === 409 && result?.quote?.chosen === null) error.quote = result.quote;
          throw error;
        }
        if (result === null) throw Error(`Сервер должен вернуть JSON для ${method} ${path}.`);
        pendingKeys.delete(signature);
        return result;
      }

            DB = {

            if (!pv(UI.f.tgt)) UI.f.tgt = DB.pvz[0].id;

      const EPS = H.map((h) => h[0] + ' ' + h[1].replace(':id', '{id}'));
      function accrue() {

      function call(m, path, body = {}, key) {
        let id,
          h = H.find((x) => {
            if (x[0] !== m) return 0;
            const r = new RegExp('^' + x[1].replace(':id', '([0-9a-f-]{36})') + '$').exec(path);
            if (r) {
              id = r[1];
              return 1;
            }
          });
        const ep = m + ' ' + (h ? h[1].replace(':id', '{id}') : path);
        const signature = JSON.stringify([
          m,
          path,
          Object.entries(body).sort(([a], [b]) => a.localeCompare(b)),
        ]);
        let st = 200,
          data,
          replay = 0;
        try {
          if (!h) throw E(404, 'Маршрут не найден');
          if (m === 'POST' && h[1] !== '/items') {
            if (!key) throw E(400, 'Idempotency-Key обязателен на POST');
            const previous = DB.idem.get(key);
            if (previous) {
              if (previous.signature !== signature)
                throw E(409, 'Этот ключ уже использован для другой операции');
              replay = 1;
              st = previous.status;
              data = structuredClone(previous.data);
            }
          }
          if (!replay) data = h[2](body, id);
        } catch (e) {
          st = e.code || 500;
          data = { error: e.message };
        }
        if (!replay && m === 'POST' && h?.[1] !== '/items' && key && st < 300)
          DB.idem.set(key, { signature, status: st, data: structuredClone(data) });
        if (st < 300) UI.used.add(ep);
        UI.log.unshift({
          ep,
          st,
          key,
          replay,
          path: path.replace(/[0-9a-f-]{36}/, (x) => sh(x)),
          t: new Date(now()).toLocaleTimeString('ru-RU'),
          err: st >= 300 ? data.error : '',
        });
        UI.log.length = Math.min(UI.log.length, 60);
        return { status: st, data, replay };

            const input = orderPayload();
            const q = quote(it(input.item_id), input.qty, pv(input.target_pvz_id)),
              ok = [q.mesh, q.hub].filter((v) => v.ok);
            q.win = ok.sort((a, c) => (f.pref === 'COST' ? a.cost - c.cost : a.hours - c.hours))[0];
            UI.q = q;
            UI.msg = null;
          } catch (e) {
            M(e.message, 0);
          }
        },
        mk: () => {
          const r = call('POST', '/orders', orderPayload(), uid());
          res(r, 'Заказ создан');
          if (r.status < 300) {
            UI.sel = r.data.id;
            UI.q = null;
          }
        },
        newitem: () => {
          const result = call('POST', '/items', itemPayload());
          res(result, 'Товар создан');
          if (result.status < 300) UI.itemDraft.name = '';
        },
        intake: () =>
          res(call('POST', `/pvz/${UI.pvz}/intake`, intakePayload(), uid()), 'Партия принята'),
        asm: (d) => {
          UI.keys[d.id] = uid();
          res(call('POST', `/orders/${d.id}/assemble`, {}, UI.keys[d.id]), 'Заказ собран');
        },
        asm2: (d) =>
          res(
            call('POST', `/orders/${d.id}/assemble`, {}, UI.keys[d.id] || uid()),
            'Повторная сборка: двойного списания нет',
          ),
        iss: (d) => res(call('POST', `/orders/${d.id}/issue`, {}, uid()), 'Заказ выдан'),
        ret: (d) => res(call('POST', `/orders/${d.id}/return`, {}, uid()), 'Возврат оформлен'),
        inc: (d) =>
          res(
            call('POST', '/incidents', { order_id: d.id, type: 'WRONG_PVZ' }, uid()),
            'Ошибка зафиксирована, маршрут пересчитан',
          ),
        run: () => {
          const currentData = DB;
          const currentUI = UI;
          try {
            UI = { ...currentUI, f: { ...currentUI.f }, log: [], used: new Set(), keys: {} };
            currentUI.scen = scen();
            const passed = currentUI.scen.filter((scenario) =>
              scenario.st.every((step) => step.ok),
            ).length;
            M(
              `Пройдено сценариев: ${passed} из ${currentUI.scen.length}`,
              passed === currentUI.scen.length,
            );
            currentUI.msg = UI.msg;
          } finally {
            DB = currentData;
            UI = currentUI;
          }
        },
      };
      function updateField(element) {
        const key = element.dataset.f;
        if (!key || busy) return;
        if (key === 'pvz') UI.pvz = element.value;
        else UI.f[key] = element.value;
        UI.q = null;
        if (['qty', 'item', 'tgt', 'pref'].includes(key)) UI.msg = null;
      }

      document.addEventListener('input', (event) => {
        const field = event.target.dataset.draft;
        if (field) UI.itemDraft[field] = event.target.value;
        if (event.target.matches('input[data-f]') && !busy) {
          updateField(event.target);
          const preview = $('#route-preview');
          if (preview) {
            preview.innerHTML = routePreview(null);
            $('[data-a="mk"]').disabled = false;
            $('#msg').replaceChildren();
          }
        }
      });
      document.addEventListener('change', (event) => {
        if (!event.target.matches('select[data-f]') || busy) return;
        updateField(event.target);
        if (apiBase && event.target.dataset.f === 'pvz') refresh();
        else render();
      });

      document.addEventListener('click', (event) => {
        const button = event.target.closest('[data-a]');
        if (!button || busy) return;
        const action = button.dataset.a;
        if (apiBase) return remoteAction(action, button.dataset);
        try {
          if (['intake', 'asm', 'iss', 'ret', 'inc'].includes(action)) UI.q = null;
          A[action]?.(button.dataset);
        } catch (error) {
          M(error.code ? `Ошибка ${error.code}: ${error.message}` : error.message, false);
        }
        render();
      });
      function scen() {
        seed();
        UI.log = [];
        UI.used = new Set();
        const P = (n) => DB.pvz.find((p) => p.name.includes(n)),
          I = (n) => DB.items.find((i) => i.name === n),
          k = uid;
        const st = (i, p) =>
            sum(
              DB.batches.filter((b) => b.item === i.id && b.pvz === p.id),
              (b) => b.qty,
            ),
          S = [],
          step = (a, t, ok, d) => a.push({ t, ok, d });
        const m2 = P('Москва-2'),
          m3 = P('Москва-3'),
          spb = P('СПб'),
          cup = I('Кружка'),
          jk = I('Куртка'),
          pl = I('Плед');
        let a = [],
          b0 = st(cup, m2);
        let r = call(
            'POST',
            '/orders',
            { item_id: cup.id, qty: 2, target_pvz_id: m3.id, preference: 'COST' },
            k(),
          ),
          o = r.data;
        step(
          a,
          `Заказ ${sh(o.id)} создан: ${o.chosen}, ${rub(o.cost)}, ${Number(o.hours).toFixed(1)} ч`,
          o.chosen === 'MESH',
          'Внутри города mesh дешевле хаба (' + rub(o.base) + '). ' + o.reason,
        );
        const key = k();
        call('POST', `/orders/${o.id}/assemble`, {}, key);
        const r2 = call('POST', `/orders/${o.id}/assemble`, {}, key);
        const r3 = call('POST', `/orders/${o.id}/assemble`, {}, k());
        step(
          a,
          'Сборка идемпотентна: повтор с тем же ключом и с новым ключом',
          st(cup, m2) === b0 - 2 && r2.replay && r3.data.replay,
          `Остаток ${m2.name}: до ${b0}, после ${st(cup, m2)} (списано один раз)`,
        );
        call('POST', `/orders/${o.id}/issue`, {}, k());
        step(
          a,
          'Выдача покупателю',
          o.status === 'ISSUED',
          'Статус: ' + o.status + ', выручка ' + rub(o.price),
        );
        S.push({ t: '1. Городской заказ', st: a });
        a = [];
        r = call(
          'POST',
          '/orders',
          { item_id: jk.id, qty: 10, target_pvz_id: spb.id, preference: 'TIME' },
          k(),
        );
        const h = r.data;
        step(
          a,
          `Заказ ${sh(h.id)}: ${h.chosen}, ${rub(h.cost)}, ${h.hours.toFixed(1)} ч`,
          h.chosen === 'HUB_TRUNK',
          'Mesh: ' + rub(h.variants.mesh.cost) + ' · хаб: ' + rub(h.variants.hub.cost),
        );
        step(
          a,
          'Вызваны заглушки хаба и магистрали',
          UI.used.has('POST /stub/hub/handle') && UI.used.has('POST /stub/trunk/move'),
          'Магистраль = chargeable_kg × км × 0.12, ставка — допущение',
        );
        S.push({ t: '2. Хаб и магистраль', st: a });
        a = [];
        const rb = st(cup, m3);
        call('POST', `/orders/${o.id}/return`, {}, k());
        step(
          a,
          'Возврат выданного заказа',
          o.status === 'RETURNED',
          `Остаток ${m3.name}: до ${rb}, после ${st(cup, m3)}; сторно выдачи ${rub(-pv(m3.id).fis)}`,
        );
        step(
          a,
          'Повторный возврат отклонён',
          call('POST', `/orders/${o.id}/return`, {}, k()).status === 409,
          'Статус-гард',
        );
        S.push({ t: '3. Возврат', st: a });
        a = [];
        r = call(
          'POST',
          '/orders',
          { item_id: cup.id, qty: 1, target_pvz_id: m3.id, preference: 'COST' },
          k(),
        );
        const e = r.data,
          c0 = e.cost;
        const ri = call('POST', '/incidents', { order_id: e.id, type: 'WRONG_PVZ' }, k());
        step(
          a,
          `Ошибка по заказу ${sh(e.id)}: ${ri.data.from} → ${ri.data.to}`,
          ri.status === 200,
          `Стоимость ${rub(c0)} → ${rub(e.cost)} (+${rub(ri.data.extra_cost)}), срок после переназначения: ${e.hours.toFixed(1)} ч`,
        );
        step(
          a,
          'Уведомление об ошибке на ПВЗ',
          DB.notes.some((n) => n.type === 'ERROR'),
          'Раздел «Уведомления»',
        );
        S.push({ t: '4. Логистическая ошибка', st: a });
        a = [];
        call('POST', `/pvz/${m2.id}/intake`, { item_id: pl.id, qty: 5 }, k());
        const l0 = sum(
          DB.ledger.filter((l) => l.kind === 'storage'),
          (l) => l.amt,
        );
        call('POST', '/system/time/advance', { days: 10 }, k());
        const l1 = sum(
          DB.ledger.filter((l) => l.kind === 'storage'),
          (l) => l.amt,
        );
        step(a, 'Время сдвинуто на 10 суток', DB.off === 10 * DAY, 'Системное время: ' + fd(now()));
        step(a, 'Начислено хранение', l1 > l0, `Хранение: до ${rub(l0)}, после ${rub(l1)}`);
        step(
          a,
          'Уведомление «долгое хранение»',
          DB.notes.some((n) => n.type === 'LONG_STORAGE'),
          'Партии старше 7 суток',
        );
        S.push({ t: '5. Длительное хранение', st: a });
        return S;
      }
      if (apiBase) {
        const refreshButton = document.createElement('button');
        refreshButton.className = 'b';
        refreshButton.dataset.a = 'refresh';
        refreshButton.textContent = 'Обновить данные';
        document.querySelector('header').append(refreshButton);
        document
          .querySelectorAll('[data-a="reset"], [data-a="nokey"]')
          .forEach((button) => button.remove());
        refresh(true);
      } else {
        seed();
        render();
      }
    </script>
  </body>
</html>
