      .truck-face {

          linear-gradient(150deg, #9761b9 4%, #6e3c90 54%, #643a83 100%);
        border-color: #523068;
        box-shadow:

          inset 1px 0 #ffffff40;
        text-shadow: 0 1px 1px #4f286b;

      .truck-face.side.near {

      .truck-face.front,
      .truck-face.rear {
        width: var(--width);
        height: var(--height);
        background: var(--front);
        border: 1px solid #22112f40;
      }
      .truck-face.front {
        transform: translate3d(var(--length), var(--width), var(--height)) rotateZ(-90deg)
          rotateX(-90deg);
      }
      .truck-face.rear {
        transform: translateZ(var(--height)) rotateZ(90deg) rotateX(-90deg);

      .truck-cargo .rear {
        background: linear-gradient(90deg, #543275 48%, #3f245b 48% 52%, #6d458a 52%);
      }
      .truck-cab .front::before,
      .truck-cab .side::before {
        content: '';
        position: absolute;
        inset: 1px 2px 6px;
        border-radius: 2px;
        background: linear-gradient(150deg, #ddf6ff, #67b2e1 45%, #424c82 48%);

      .truck-cab .front::after,
      .truck-cargo .rear::after {
        content: '';

        left: 1px;
        bottom: 2px;
        width: 4px;
        height: 3px;
        border-radius: 1px;

        top: var(--wheel-y);
        width: 11px;
        height: 11px;
        border: 1px solid #1c1924;
        border-radius: 50%;
        backface-visibility: hidden;
        transform: translateZ(6px) rotateX(var(--wheel-angle));
        background: radial-gradient(circle, #b5afc2 0 37%, #302937 39% 66%, #201b26 68%);

      .tabs button {
        font-size: 14px;
      }
      .tabs button.on {
        border-color: var(--ac);
        color: var(--ink-accent);
      }
      table {
        font-size: 13px;
      }
      th,
      td {
        padding: 10px 12px;
      }
      th {
        background: var(--sf2);
        font-weight: 700;
      }
      tbody tr:hover {
        background: var(--soft-hover);
      }
      .tw {
        scrollbar-color: var(--bd) var(--sf);
      }
      .order-filters input[type='search'] {
        width: min(270px, 100%);
        border-radius: 12px;
        padding-left: 12px;
      }
      .order-financials dd,
      .big {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.035em;
      }
      .v.no {
        opacity: 1;
        background: var(--sf2);
      }
      .v.win {
        border-color: var(--ac);
      }
      .con {
        box-shadow: none;
      }
      .cov span.on {
        background: var(--mint);
        border-color: var(--bd);
        color: var(--ink-accent);
      }
      #app .leaflet-overlay-pane path[fill='#8c1a9e'] {
        fill: var(--ac);
      }
      #app .leaflet-overlay-pane path[fill='#c71982'] {
        fill: var(--map-end);
      }
      #app path[stroke='#921ca4'] {
        stroke: var(--map-line);
      }
      .delivery-geography .leaflet-control-attribution {
        max-width: 100%;
        padding-inline: 5px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      @media (prefers-reduced-motion: no-preference) {
        .b,
        .seg button {
          transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
        }
      }
      @media (max-width: 760px) {
        header {
          position: static;
          padding: 10px 14px;
        }
        .header-actions {
          width: 100%;
          margin-left: 0;
          gap: 6px;
        }
        header .clock {
          font-size: 11px;
        }
        main {
          padding: 16px 12px calc(84px + env(safe-area-inset-bottom, 0px));
        }
        #roles {
          position: fixed;
          right: 0;
          bottom: 0;
          left: 0;
          z-index: 8;
          display: flex;
          gap: 6px;
          padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px));
          border: 0;
          border-top: 1px solid var(--bd);
          border-radius: 0;
          background: var(--sf);
          box-shadow: 0 -2px 14px #1414280f;
        }
        #roles button {
          min-width: 0;
          flex: 1 1 0;
          padding-inline: 5px;
          font-size: 13px;
        }
        #roles button.on {
          background: var(--mint);
          box-shadow: none;
        }
        .b,
        .seg button,
        .tabs button,
        input,
        select,
        #delivery-drive {
          min-height: 44px;
        }
        .tracking-card {
          scroll-margin-top: 12px;
        }
        .delivery-map {
          padding: 10px;
        }
        .delivery-geography .leaflet-control-attribution {
          font-size: 10px;
        }
        .delivery-geography .leaflet-tooltip-bottom.delivery-stop-label {
          margin-top: 0;
          padding: 3px 6px;
          line-height: 1.2;
        }
        .delivery-geography .leaflet-control-zoom a {
          width: 38px;
          height: 40px;
          line-height: 40px;
        }
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('mesh-pvz-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {
        // The browser can block storage for local files.
      }
    </script>

    <header>
      <div class="brand">Mesh<i>·</i>ПВЗ</div>
      <div class="seg" id="roles"></div>
      <div class="sp"></div>
      <div class="header-meta">
        <span class="chip stub" title="Хаб, магистраль, покупатель, платёжный шлюз"
          >заглушки: хаб · магистраль · покупатель</span
        >
        <span class="clock" id="clock"></span>
      </div>
      <div class="header-actions">
        <button class="b" data-a="adv" data-d="1">+1 день</button
        ><button class="b" data-a="adv" data-d="10">+10 дней</button>
        <button class="b theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
          Тёмная тема
        </button>
        <button class="b d" data-a="reset">Сброс демо</button>
      </div>
    </header>
    <main>
      <div id="msg" role="status" aria-live="polite"></div>
      <div id="app"></div>
      <details class="con">
        <summary id="csum"></summary>
        <div class="cov" id="cov"></div>
        <div class="lg" id="lg"></div>
        <div class="row" style="margin: 10px 0 0">
          <button class="b" data-a="nokey">Тест: POST без Idempotency-Key</button
          ><button class="b" data-a="health">GET /health</button>
        </div>
      </details>
      <p class="mu">
        Тарифы и пороги в демо — допущение, не тариф RWB. Покупатель, оплата, хаб и магистраль в
        демо представлены заглушками.
      </p>

    <script>
      const uid = () => {
          const bytes = crypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 15) | 64;
          bytes[8] = (bytes[8] & 63) | 128;
          const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('');
          return hex.replace(/^(........)(....)(....)(....)(............)$/, '$1-$2-$3-$4-$5');
        },
        sh = (i) => (i ? String(i).slice(0, 8) : '—');
      const rub = (n) =>
        (Math.round(n * 100) / 100).toLocaleString('ru-RU', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }) + ' ₽';
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c],
        );
      const $ = (s) => document.querySelector(s),
        T0 = Date.parse('2026-11-25T10:00:00Z'),
        DAY = 864e5;
      let DB,
        UI = {
          role: 'S',
          pvz: null,
          tab: { S: 'order', P: 'orders', X: 'run' },
          log: [],
          used: new Set(),
          f: { qty: 2, intakeQty: 2, pref: 'COST' },
          orderFilters: {
            S: { query: '', status: '', point: '' },
            P: { query: '', status: '', point: '' },
          },
          exampleOpen: false,
          playExample: false,
          itemDraft: { name: '', kg: '0.3', vol: '0.003', price: '900' },
          q: null,
          sel: null,
          keys: {},
          scen: null,
          msg: null,
        };
      function setBusy(value) {
        busy = value;
        $('#app').setAttribute('aria-busy', String(value));
        document.querySelectorAll('button, input, select').forEach((control) => {
          if (value && !control.disabled) {
            control.disabled = true;
            control.dataset.pending = '';
          } else if (!value && 'pending' in control.dataset) {
            control.disabled = false;
            delete control.dataset.pending;
          }
        });
      }
      const now = () => DB.serverTime ?? T0 + DB.off,
        E = (c, m) => Object.assign(new Error(m), { code: c });
      const pv = (id) => DB.pvz.find((p) => p.id === id),
        it = (id) => DB.items.find((i) => i.id === id);
      const od = (id) => {
        const o = DB.orders.find((o) => o.id === id);
        if (!o) throw E(404, 'Заказ не найден');
        return o;
      };
      const load = (id) =>
        DB.batches.filter((b) => b.pvz === id).reduce((s, b) => s + b.qty, 0) +
        DB.orders
          .filter(
            (o) =>
              o.target === id &&
              (o.status === 'ASSEMBLED' || (o.status === 'CREATED' && o.source_pvz_id !== id)),
          )
          .reduce((s, o) => s + o.qty, 0);
      const led = (kind, pvz, amt, why, oid) =>
        DB.ledger.push({ t: now(), kind, pvz, amt, why, oid });
      const note = (type, pvz, text) => DB.notes.unshift({ t: now(), type, pvz, text });
      const km = (a, b) =>
        Math.hypot(
          (a.lat - b.lat) * 111,
          (a.lng - b.lng) * 111 * Math.cos((a.lat * Math.PI) / 180),
        );
      const sum = (a, f) => a.reduce((s, x) => s + f(x), 0),
        fd = (t) => new Date(t).toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' });
      function seed() {
        const C = {
          m: { id: uid(), name: 'Москва', code: 'MSK' },
          s: { id: uid(), name: 'Санкт-Петербург', code: 'SPB' },
        };
        const mk = (c, n, a, lat, lng, cap, fi, fa, fis, fs) => ({
          id: uid(),
          city: C[c].id,
          name: n,
          address: a,
          lat,
          lng,
          cap,
          fi,
          fa,
          fis,
          fs,
          active: true,
        });
        const pvz = [
          mk('m', 'ПВЗ Москва-1', 'Тверская, 7', 55.76, 37.61, 100, 4, 18, 12, 1.5),
          mk('m', 'ПВЗ Москва-2', 'Арбат, 20', 55.75, 37.59, 60, 5, 20, 14, 1.8),
          mk('m', 'ПВЗ Москва-3', 'Ленинский пр., 90', 55.69, 37.53, 30, 4, 16, 10, 1.2),
          mk('s', 'ПВЗ СПб-1', 'Невский пр., 50', 59.93, 30.34, 80, 4, 17, 11, 1.4),
        ];
        const items = [
          { id: uid(), name: 'Кружка', kg: 0.4, vol: 0.002, price: 450 },
          { id: uid(), name: 'Плед', kg: 1.2, vol: 0.012, price: 1900 },
          { id: uid(), name: 'Куртка', kg: 1.5, vol: 0.03, price: 4200 },
        ];
        const bt = (i, p, q, d) => ({
          id: uid(),
          item: items[i].id,
          pvz: pvz[p].id,
          qty: q,
          res: 0,
          at: T0 - d * DAY,
          chg: T0 - d * DAY,
        });
        DB = {
          off: 0,
          cities: Object.values(C),
          pvz: pvz,
          hubs: [
            { id: uid(), city: C.m.id, name: 'Хаб Москва', is_stub: true },
            { id: uid(), city: C.s.id, name: 'Хаб СПб', is_stub: true },
          ],
          seller: { id: uid(), name: 'ИП Орлов' },
          items,
          batches: [
            bt(0, 0, 40, 1),
            bt(0, 1, 15, 1),
            bt(0, 3, 20, 1),
            bt(1, 0, 10, 1),
            bt(1, 3, 5, 1),
            bt(1, 2, 26, 1),
            bt(2, 0, 30, 1),
          ],
          orders: [],
          ledger: [],
          notes: [],
          idem: new Map(),
          incidents: [],
        };
        UI.pvz = pvz[0].id;
        UI.f = {
          qty: 2,
          intakeQty: 2,
          pref: 'COST',
          item: items[0].id,
          intakeItem: items[0].id,
          tgt: pvz[2].id,
        };
        UI.keys = {};
        UI.q = null;
        UI.sel = null;
        UI.exampleOpen = false;
        UI.playExample = false;
      }
      const demoHubPositions = {
        MSK: { lat: 55.73, lng: 37.67 },
        SPB: { lat: 59.894573, lng: 30.39197 },
      };
      function quote(i, qty, t) {
        const ch = Math.max(i.kg * qty, i.vol * qty * 250);
        const c = DB.batches
          .filter((b) => b.item === i.id && b.qty - b.res >= qty && pv(b.pvz).active)
          .map((b) => ({ b, d: km(pv(b.pvz), t) }))
          .sort((x, y) => x.d - y.d)[0];
        if (!c) throw E(409, 'Нет партии с остатком ' + qty + ' ед. ни на одном ПВЗ');
        const sp = pv(c.b.pvz),
          same = sp.city === t.city,
          d = Math.max(c.d, 0.5),
          full = !t.active || load(t.id) + (sp.id === t.id ? 0 : qty) > t.cap,
          blk = !t.active
            ? 'Целевой ПВЗ недоступен'
            : 'Целевой ПВЗ заполнен (' + load(t.id) + '/' + t.cap + ')';
        const hf = call('POST', '/stub/hub/handle', { chargeable_kg: ch }, uid()).data.hub_fee,
          tr = call(
            'POST',
            '/stub/trunk/move',
            { chargeable_kg: ch, km: same ? 12 : d },
            uid(),
          ).data;
        const mc = 20 + ch * d * 0.35,
          mh = 3 + d / 40;
        const mesh = {
          scheme: 'MESH',
          cost: mc,
          hours: mh,
          ok: !full && same,
          why: full
            ? blk
            : !same
              ? 'Прямой рейс доступен только внутри города'
              : 'прямая доставка между ПВЗ',
          segs: [
            { n: sp.name, l: 'партия' },
            { n: t.name, l: rub(mc) + ' · ' + mh.toFixed(1) + ' ч', e: 1 },
          ],
        };
        const hc = 18 + hf.total + tr.cost + 25,
          hh = 4 + 6 + tr.hours + 3;
        const hub = {
          scheme: 'HUB_TRUNK',
          cost: hc,
          hours: hh,
          ok: !full,
          why: full ? blk : 'через хаб и магистраль',
          segs: [
            { n: sp.name, l: 'партия' },
            {
              n: 'Хаб',
              l: rub(hf.total),
              is_stub: true,
              ...demoHubPositions[DB.cities.find((city) => city.id === sp.city)?.code],
            },
            {
              n: 'Магистраль',
              l: rub(tr.cost) + ' · ' + tr.hours.toFixed(1) + ' ч',
              is_stub: true,
            },
            { n: t.name, l: 'последняя миля ' + rub(25), e: 1 },
          ],
        };
        return {
          mesh,
          hub,
          src: c.b,
          srcName: sp.name,
          ch,
          same,
          block:
            blk +
            (full
              ? '. Свободные ПВЗ города: ' +
                (DB.pvz
                  .filter(
                    (p) =>
                      p.active &&
                      p.city === t.city &&
                      p.id !== t.id &&
                      load(p.id) + (p.id === sp.id ? 0 : qty) <= p.cap,
                  )
                  .map((p) => p.name)
                  .join(', ') || 'нет')
              : ''),
        };
      }
      function createOrder(b) {
        const i = it(b.item_id),
          t = pv(b.target_pvz_id),
          qty = +b.qty;
        if (!i || !t || !Number.isSafeInteger(qty) || qty < 1)
          throw E(422, 'Проверьте товар, ПВЗ и количество');
        const q = quote(i, qty, t),
          pref = b.preference === 'TIME' ? 'TIME' : 'COST',
          ok = [q.mesh, q.hub].filter((v) => v.ok);
        if (!ok.length) throw E(409, q.block);
        const ch = [...ok].sort((a, c) =>
            pref === 'COST' ? a.cost - c.cost : a.hours - c.hours,
          )[0],
          alt = ok.find((v) => v !== ch),
          oth = ch === q.mesh ? q.hub : q.mesh;
        const reason = alt
          ? `Выбрана ${ch.scheme} при приоритете «${pref === 'COST' ? 'стоимость' : 'срок'}»: ${pref === 'COST' ? 'дешевле на ' + rub(alt.cost - ch.cost) + ' (' + Math.round((1 - ch.cost / alt.cost) * 100) + '%)' : 'быстрее на ' + (alt.hours - ch.hours).toFixed(1) + ' ч'}. Альтернатива ${alt.scheme}: ${rub(alt.cost)}, ${alt.hours.toFixed(1)} ч.`
          : `Единственная допустимая схема — ${ch.scheme}. ${oth.scheme}: ${oth.why}.`;
        q.src.res += qty;
        const sla = q.same ? 24 : 72;
        const o = {
          id: uid(),
          seller: DB.seller.id,
          item: i.id,
          qty,
          target: t.id,
          source_pvz_id: q.src.pvz,
          pref,
          status: 'CREATED',
          chosen: ch.scheme,
          variants: { mesh: q.mesh, hub: q.hub },
          segs: ch.segs,
          cost: ch.cost,
          cost0: ch.cost,
          base: q.hub.cost,
          hours: ch.hours,
          sla,
          reason,
          batch: q.src.id,
          price: i.price * qty,
          created: now(),
          history: [{ type: 'CREATED', at: now() }],
          incidents: [],
        };
        DB.orders.unshift(o);
        return o;
      }
      const apiBase = new URLSearchParams(location.search).get('api')?.trim().replace(/\/+$/, '');
      let busy = false;
      let screenError = '';
      let screenData = new Map();
      const pendingKeys = new Map();

      const cacheKey = (path, query = {}) => path + '?' + new URLSearchParams(query);
      function read(method, path, query = {}) {
        if (!apiBase) return call(method, path, query).data;
        const key = cacheKey(path, query);
        if (!screenData.has(key)) throw Error('Данные экрана недоступны. Обновите страницу.');
        return screenData.get(key);
      }

      async function request(method, path, payload = {}) {
        const url = new URL(apiBase + path, location.href);
        if (!['http:', 'https:'].includes(url.protocol)) throw Error('Укажите HTTP-адрес API.');
        const headers = { Accept: 'application/json' };
        const body = method === 'POST' ? JSON.stringify(payload) : undefined;
        const signature = path + ' ' + body;
        if (body) {
          headers['Content-Type'] = 'application/json';
          if (path !== '/items') {
            if (!pendingKeys.has(signature)) pendingKeys.set(signature, uid());
            headers['Idempotency-Key'] = pendingKeys.get(signature);
          }
        } else {
          url.search = new URLSearchParams(payload).toString();
        }
        let response;
        try {
          response = await fetch(url, {
            method,
            headers,
            body,
            signal: AbortSignal.timeout(10000),
          });
        } catch {
          throw Error(
            'Сервер недоступен. Проверьте адрес API и настройки CORS. Повтор операции сохранит её ключ.',
          );
        }
        if (
          response.status >= 400 &&
          response.status < 500 &&
          ![408, 425, 429].includes(response.status)
        )
          pendingKeys.delete(signature);
        UI.log.unshift({
          t: new Date().toLocaleTimeString('ru-RU'),
          ep: method,
          path,
          st: response.status,
          key: headers['Idempotency-Key'],
        });
        UI.log.length = Math.min(UI.log.length, 60);
        if (response.ok) UI.used.add(method + ' ' + path.replace(/[0-9a-f-]{36}/g, '{id}'));
        if (response.status === 204 && method === 'POST') {
          pendingKeys.delete(signature);
          return null;
        }
        const result = await response.json().catch(() => null);
        if (!response.ok) {
          const reason = result?.error ?? result?.detail ?? result?.message;
          throw Error(
            `${method} ${path} · HTTP ${response.status}${typeof reason === 'string' ? ' · ' + reason : ''}`,
          );
        }
        if (result === null) throw Error(`Сервер должен вернуть JSON для ${method} ${path}.`);
        pendingKeys.delete(signature);
        return result;
      }

            if (

              !Array.isArray(data.pvz) ||
              !data.pvz.length ||
              !Array.isArray(data.items) ||
              !Array.isArray(data.orders)
            ) {
              throw Error(
                'Ответ /frontend/bootstrap не содержит справочники, заказы или продавца.',
              );
            }
            const serverTime = data.now ? Date.parse(data.now) : Date.now();
            DB = {
              ...data,
              off: 0,
              serverTime: Number.isFinite(serverTime) ? serverTime : Date.now(),
            };
            if (!pv(UI.pvz)) UI.pvz = DB.pvz[0].id;
            if (!pv(UI.f.tgt)) UI.f.tgt = DB.pvz[0].id;
            if (!it(UI.f.item)) UI.f.item = DB.items[0]?.id ?? '';
            if (!it(UI.f.intakeItem)) UI.f.intakeItem = DB.items[0]?.id ?? '';
            if (!DB.orders.some((order) => order.id === UI.sel)) UI.sel = null;
          }
          const requests = [];
          if (UI.role === 'S') {
            if (UI.tab.S === 'items')
              requests.push(...DB.items.map((item) => [`/items/${item.id}/batches`]));
            if (UI.tab.S === 'an') requests.push([`/analytics/seller/${DB.seller.id}`]);
            if (UI.tab.S === 'order' && UI.sel) requests.push([`/orders/${UI.sel}`]);
          } else {
            const paths = {
              stock: [`/pvz/${UI.pvz}/stock`],
              an: [`/analytics/pvz/${UI.pvz}`],
              nt: ['/notifications', { pvz: UI.pvz }],
            };
            if (paths[UI.tab.P]) requests.push(paths[UI.tab.P]);
          }
          const entries = await Promise.all(
            requests.map(async ([path, query]) => [
              cacheKey(path, query),
              await request('GET', path, query),
            ]),
          );
          screenData = new Map(entries);
          screenError = '';
        } catch (error) {
          screenError = error.message;

          setBusy(false);

        return Math.abs(lat) <= 85 && Math.abs(lng) <= 180 ? [lat, lng] : null;
      }

      const pointKey = (point) => point.map((value) => value.toFixed(5)).join(',');
      const distinctSteps = (points) =>
        points.filter((point, index) => !index || pointKey(point) !== pointKey(points[index - 1]));

      function normalizeRoad(geometry) {
        const points = Array.isArray(geometry)
          ? geometry.map(coordinates)
          : geometry?.type === 'LineString' && Array.isArray(geometry.coordinates)
            ? geometry.coordinates.map((point) =>
                Array.isArray(point) ? coordinates([point[1], point[0]]) : null,
              )
            : [];
        return points.length >= 2 && points.every(Boolean) ? distinctSteps(points) : [];
      }

      function decodeDemoRoad(encoded) {
        const points = [];
        let cursor = 0;
        let lat = 0;
        let lng = 0;
        const delta = () => {
          let value = 0;
          let shift = 0;
          let chunk;
          do {
            chunk = encoded.charCodeAt(cursor++) - 63;
            value |= (chunk & 31) << shift;
            shift += 5;
          } while (chunk >= 32);
          return value & 1 ? ~(value >> 1) : value >> 1;
        };
        while (cursor < encoded.length) {
          lat += delta();
          lng += delta();
          points.push([lat / 1e6, lng / 1e6]);
        }
        return points;
      }

      const demoRoads = JSON.parse($('#demo-road-legs').textContent);

      function roadForDemo(waypoints) {
        const points = [];
        for (let index = 1; index < waypoints.length; index++) {
          const leg = demoRoads[pointKey(waypoints[index - 1]) + ';' + pointKey(waypoints[index])];
          if (!leg) return [];
          points.push(...decodeDemoRoad(leg));
        }
        return distinctSteps(points);
      }

      async function requestRoad(waypoints, signal) {
        const key = waypoints.map(pointKey).join(';');
        if (recentRoads.has(key)) return recentRoads.get(key);
        const url = new URL(routerEndpoint, location.href);
        if (!['http:', 'https:'].includes(url.protocol))
          throw Error('Неверный адрес маршрутизатора');
        const locations = waypoints.map(([lat, lng]) => [lng, lat].join(',')).join(';');
        url.pathname = url.pathname.replace(/\/+$/, '') + '/' + locations;
        url.searchParams.set('geometries', 'geojson');
        url.searchParams.set('overview', 'full');
        url.searchParams.set('steps', 'false');
        const response = await fetch(url, {
          signal: AbortSignal.any([signal, AbortSignal.timeout(9000)]),
        });
        if (!response.ok) throw Error('Маршрутизатор недоступен');
        const result = await response.json();
        if (result.code !== 'Ok') throw Error('Проезд не найден');
        const points = normalizeRoad(result.routes?.[0]?.geometry);
        if (points.length < 2) throw Error('Нет дорожной геометрии');
        if (recentRoads.size >= 24) recentRoads.delete(recentRoads.keys().next().value);
        recentRoads.set(key, points);
        return points;
      }

      function measureRoad(points) {
        const positions = [0];
        for (let index = 1; index < points.length; index++) {
          positions.push(
            positions[index - 1] + L.latLng(points[index - 1]).distanceTo(points[index]),
          );
        }
        return { points, positions, meters: positions.at(-1) };
      }

      function carPosition(road, fraction) {
        if (!road.meters) return road.points[0];
        const target = road.meters * fraction;
        let low = 0;
        let high = road.points.length - 1;
        while (high - low > 1) {
          const mid = (low + high) >> 1;
          if (road.positions[mid] <= target) low = mid;
          else high = mid;
        }
        const [lat, lng] = road.points[low];
        const [nextLat, nextLng] = road.points[high];
        const segment = road.positions[high] - road.positions[low];
        const offset = (target - road.positions[low]) / segment;
        return [lat + (nextLat - lat) * offset, lng + (nextLng - lng) * offset];
      }

      const truckModel = `<span class="truck-model" aria-hidden="true">
        <span class="truck-shadow"></span>
        ${['cargo', 'cab']
          .map(
            (part) => `<span class="truck-box truck-${part}">
          <span class="truck-face roof"></span>
          <span class="truck-face side near">${part === 'cargo' ? 'WB' : ''}</span>
          <span class="truck-face side far">${part === 'cargo' ? 'WB' : ''}</span>
          <span class="truck-face front"></span>
          <span class="truck-face rear"></span>
        </span>`,
          )
          .join('')}
        <span class="truck-wheel back near"></span><span class="truck-wheel forward near"></span>
        <span class="truck-wheel back far"></span><span class="truck-wheel forward far"></span>
      </span>`;

      function mountDeliveryMap() {
        const element = $('#delivery-geography');
        if (!element || !mapInput) return;
        const { order, stops, progress } = mapInput;
        const note = $('#delivery-map-note');
        const tilesNote = $('#delivery-tiles-note');
        const drive = $('#delivery-drive');
        const driveNote = $('#delivery-drive-note');
        const supplied = normalizeRoad(order.route_geometry);
        const resolveStop = (stop) =>
          coordinates(stop) || coordinates(DB.pvz.find((point) => point.name === stop?.n));
        const source = pv(order.source_pvz_id);
        const target = pv(order.target ?? order.target_pvz_id);
        const start = coordinates(source) || resolveStop(stops[0]) || supplied[0];
        const end = coordinates(target) || resolveStop(stops.at(-1)) || supplied.at(-1);
        if (!start || !end) {
          element.hidden = true;
          note.textContent = 'Для карты нужны координаты ПВЗ отправления и выдачи.';
          return;
        }

        const middle = stops
          .slice(1, -1)
          .map((stop) => ({
            name: stop.n,
            address: stop.address ?? DB.pvz.find((point) => point.name === stop.n)?.address,
            label: /хаб/i.test(stop.n ?? '') ? 'Хаб' : stop.n || 'Остановка',
            stub: Boolean(stop.is_stub || stop.h),
            point: resolveStop(stop),
          }))
          .filter((stop) => stop.point);
        const waypoints = distinctSteps([start, ...middle.map((stop) => stop.point), end]);
        const map = L.map(element, {
          scrollWheelZoom: true,
          touchZoom: true,
          zoomAnimation: false,
          fadeAnimation: false,
          markerZoomAnimation: false,
        }).setView(start, 13);
        deliveryMap = map;
        map.attributionControl.setPrefix('<a href="https://leafletjs.com/">Leaflet</a>');
        const controller = new AbortController();
        let frame = 0;
        stopDeliveryMap = () => {
          controller.abort();
          cancelAnimationFrame(frame);
        };

        const bounds = L.latLngBounds(waypoints);
        const fit = () =>
          map.fitBounds(bounds, {
            paddingTopLeft: [38, 60],
            paddingBottomRight: [38, 42],
            maxZoom: 15,
            animate: false,
          });
        const pins = [
          {
            label: 'Отправление',
            name: source?.name ?? stops[0]?.n,
            address: source?.address ?? stops[0]?.address,
            point: start,
          },
          ...middle,
          {
            label: 'Выдача',
            name: target?.name ?? stops.at(-1)?.n,
            address: target?.address ?? stops.at(-1)?.address,
            point: end,
          },
        ];
        const uniquePins = new Map();
        for (const stop of pins) {
          const key = pointKey(stop.point);
          const existing = uniquePins.get(key);
          if (existing) {
            existing.label += ' и ' + stop.label.toLowerCase();
            existing.destination ||= stop.label === 'Выдача';
          } else {
            uniquePins.set(key, { ...stop, destination: stop.label === 'Выдача' });
          }
        }
        for (const stop of uniquePins.values()) {
          const label = document.createElement('span');
          label.textContent = stop.label;
          const popup = document.createElement('div');
          const heading = document.createElement('strong');
          heading.textContent = stop.name || stop.label;
          const address = document.createElement('div');
          address.textContent =
            stop.address || (stop.stub ? 'Демонстрационная точка' : 'Адрес не указан');
          popup.append(heading, address);
          const pin = L.circleMarker(stop.point, {
            radius: 8,
            color: '#fff',
            weight: 2,
            fillColor: stop.destination ? '#c71982' : '#8c1a9e',
            fillOpacity: 1,
          })
            .bindTooltip(label, {
              permanent: true,
              direction: 'bottom',
              offset: [0, 8],
              className: 'delivery-stop-label',
            })
            .bindPopup(popup)
            .addTo(map);
          const path = pin.getElement();
          path.setAttribute('tabindex', '0');
          path.setAttribute('role', 'button');
          path.setAttribute('aria-label', stop.label + ': ' + (stop.name ?? ''));
          path.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              pin.openPopup();
            }
          });
        }

        const reset = L.control({ position: 'topright' });
        reset.onAdd = () => {
          const button = L.DomUtil.create('button', 'b fit-delivery-map');
          button.type = 'button';
          button.textContent = 'Весь маршрут';
          L.DomEvent.disableClickPropagation(button);
          L.DomEvent.on(button, 'click', fit);
          return button;
        };
        reset.addTo(map);
        fit();

        const truck = L.divIcon({
          className: 'map-vehicle-icon',
          html: truckModel,
          iconSize: [70, 68],
          iconAnchor: [35, 34],
        });
        const marker = L.marker(progress >= 100 ? end : start, {
          icon: truck,
          interactive: false,
        }).addTo(map);
        function showRoad(points, sourceLabel) {
          const road = measureRoad(points);
          const placeTruck = (fraction) => marker.setLatLng(carPosition(road, fraction));
          if (!road.meters) {
            placeTruck(0);
            note.textContent = 'Отправление и выдача в одном ПВЗ. Поездка не нужна.';
            return;
          }

          const pane = map.createPane('delivery-road');
          pane.style.zIndex = '390';
          const lineStyle = { pane: 'delivery-road', interactive: false };
          L.polyline(points, { ...lineStyle, color: '#fff', weight: 9, opacity: 0.92 }).addTo(map);
          L.polyline(points, { ...lineStyle, color: '#921ca4', weight: 5, opacity: 0.95 }).addTo(
            map,
          );
          bounds.extend(L.latLngBounds(points));
          fit();
          placeTruck(progress / 100);
          const distance =
            road.meters >= 1000
              ? (road.meters / 1000).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' км'
              : Math.round(road.meters) + ' м';
          note.textContent = `${sourceLabel} · ${distance}. Положение машины рассчитано по статусу.`;

          drive.hidden = false;
          const stopDrive = () => {
            cancelAnimationFrame(frame);
            frame = 0;
            marker.getElement().classList.remove('is-driving');
            drive.textContent = 'Показать проезд';
            drive.setAttribute('aria-pressed', 'false');
            driveNote.textContent = '';
            placeTruck(progress / 100);
          };
          drive.addEventListener(
            'click',
            () => {
              if (frame) return stopDrive();
              marker.getElement().classList.add('is-driving');
              drive.textContent = 'Остановить проезд';
              drive.setAttribute('aria-pressed', 'true');
              driveNote.textContent = 'Демонстрация движения по маршруту.';
              const begins = performance.now();
              const advance = (time) => {
                const fraction = Math.min(1, Math.max(0, (time - begins) / 9500));
                placeTruck(fraction);
                if (fraction < 1) frame = requestAnimationFrame(advance);
                else stopDrive();
              };
              placeTruck(0);
              frame = requestAnimationFrame(advance);
            },
            { signal: controller.signal },
          );
          if (UI.playExample) {
            UI.playExample = false;
            drive.click();
          }
        }

        const demo = !apiBase && supplied.length < 2 ? roadForDemo(waypoints) : [];
        if (supplied.length >= 2) {
          showRoad(supplied, 'Дорожный маршрут из заказа');
        } else if (demo.length >= 2) {
          map.attributionControl.addAttribution(osmCredit);
          map.attributionControl.addAttribution(
            '<a href="https://routing.openstreetmap.de/about.html">OSRM/FOSSGIS</a> · <a href="https://www.openstreetmap.org/fixthemap">Исправить карту</a>',
          );
          showRoad(demo, 'Дорожный маршрут демо');
        } else if (waypoints.length < 2) {
          showRoad([start], '');
        } else if (routerEndpoint) {
          note.textContent = 'Строим маршрут по дорожной сети…';
          void requestRoad(waypoints, controller.signal)
            .then((points) => {
              if (!controller.signal.aborted) showRoad(points, 'Дорожный маршрут OSRM');
            })
            .catch(() => {
              if (!controller.signal.aborted)
                note.textContent =
                  'Маршрутизатор не вернул путь. На карте показаны точки доставки.';
            });
        } else {
          note.textContent = 'Дорожный маршрут пока недоступен. На карте показаны точки доставки.';
        }

        if (['http:', 'https:'].includes(location.protocol)) {
          const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: osmCredit,
          });
          let hasTiles = false;
          tiles.on('tileerror', () => {
            if (!hasTiles) {
              tilesNote.hidden = false;
              tilesNote.textContent = 'Подложка с улицами недоступна.';
            }
          });
          tiles.on('tileload', () => {
            hasTiles = true;
            tilesNote.hidden = true;
          });
          tiles.addTo(map);
        } else {
          tilesNote.hidden = false;
          tilesNote.textContent = 'Для подложки с названиями улиц открой страницу по HTTP.';
        }
      }

      function deliveryTracker(order) {
        const milestones = {
          CREATED: [0, 'Ожидает сборки'],
          ASSEMBLED: [50, 'Собран · ожидает выдачи'],
          ISSUED: [100, 'Выдан покупателю'],
          RETURNED: [100, 'Возвращён в ПВЗ выдачи'],
        };
        const [progress, status] = Object.hasOwn(milestones, order.status)
          ? milestones[order.status]
          : [0, order.status || 'Статус уточняется'];
        const stops = Array.isArray(order.segs) ? order.segs.filter(Boolean) : [];
        if (!stops.length && !order.route_geometry && !order.source_pvz_id) return '';
        mapInput = { order, stops, progress };
        const stopLabels = stops
          .map((stop) => {
            const stub = stop.is_stub || stop.h ? ' · заглушка' : '';
            return `<li>${esc(stop.n)}${stub}</li>`;
          })
          .join('');
        const hours = Number(order.hours);
        const sla = Number(order.sla);
        const hasSla =
          order.hours != null &&
          order.sla != null &&
          Number.isFinite(hours) &&
          Number.isFinite(sla) &&
          sla > 0 &&
          hours >= 0;
        const difference = Number(order.base) - Number(order.cost);
        const comparison =
          order.base == null || order.cost == null || !Number.isFinite(difference)
            ? ''
            : Math.abs(difference) < 0.005
              ? 'Стоимость на уровне базового маршрута'
              : `${difference > 0 ? 'Дешевле' : 'Дороже'} базового маршрута на ${rub(Math.abs(difference))}`;
        return `<div class="delivery-map">
          <p class="map-caption">Отслеживание по статусу заказа · без GPS</p>
          <div class="map-status-row">
            <strong>${esc(status)}</strong>
            <button id="delivery-drive" class="b" type="button" aria-pressed="false" hidden>Показать проезд</button>
          </div>
          <div id="delivery-geography" class="delivery-geography" role="region" aria-label="Карта маршрута заказа"></div>
          <p id="delivery-map-note" class="map-caption" role="status"></p>
          <p id="delivery-tiles-note" class="map-caption" hidden></p>
          <p id="delivery-drive-note" class="map-caption" role="status"></p>
          <div class="map-track" style="--progress:${progress}%" aria-hidden="true"></div>
          <ol class="map-stops" aria-label="Этапы маршрута">${stopLabels}</ol>
        </div>
        <div class="tracking-metrics">
          ${hasSla ? `<p>${chip(hours <= sla ? 'В пределах SLA' : 'Риск превышения SLA', hours <= sla ? 'ok' : 'er')} Расчёт: ${hours.toFixed(1)} ч из ${sla} ч</p>` : ''}
          ${comparison ? `<p class="mu">${comparison}</p>` : ''}
        </div>`;
      }
      function variant(v, win) {
        return `<div class="v ${win ? 'win' : ''} ${v.ok ? '' : 'no'}"><div class="row" style="margin:0;justify-content:space-between"><b>${esc(v.scheme)}</b>${win ? chip('рекомендуется', 'ac') : v.ok ? '' : chip('недоступно', 'er')}</div>
 <div class="big">${v.ok ? rub(v.cost) : '—'}</div><div class="mu">${v.ok ? Number(v.hours).toFixed(1) + ' ч' : 'Недоступно'} · ${esc(v.why)}</div>${route(v.segs)}</div>`;
      }
      function orderRow(o, pvzView) {
        const i = it(o.item);
        return `<tr><td title="${esc(o.id)}">${esc(sh(o.id))}</td><td>${esc(i?.name ?? o.item)} × ${esc(o.qty)}</td>${pvzView ? '' : `<td>${esc(pv(o.target)?.name ?? o.target)}</td>`}<td>${chip(Object.hasOwn(SN, o.status) ? SN[o.status] : esc(o.status), Object.hasOwn(SC, o.status) ? SC[o.status] : '')}</td><td>${chip(esc(o.chosen))}</td><td>${rub(o.cost)}</td><td>${Number(o.hours).toFixed(1)} ч ${Number(o.hours) <= Number(o.sla) ? '' : chip('вне SLA', 'er')}</td><td style="white-space:nowrap">${pvzView ? pvzAct(o) : `<button class="b" data-a="sel" data-id="${esc(o.id)}">Детали</button>`}</td></tr>`;
      }
      function pvzAct(o) {
        const b = (a, t, c = '') =>
          `<button class="b ${c}" data-a="${a}" data-id="${esc(o.id)}">${t}</button> `;
        return (
          (o.status === 'CREATED' && o.source_pvz_id === UI.pvz ? b('asm', 'Собрать', 'p') : '') +
          (o.status === 'ASSEMBLED'
            ? (!apiBase && UI.keys[o.id] && o.source_pvz_id === UI.pvz
                ? b('asm2', 'Повтор сборки')
                : '') + (o.target === UI.pvz ? b('iss', 'Выдать', 'p') : '')
            : '') +
          (o.status === 'ISSUED' && o.target === UI.pvz ? b('ret', 'Возврат') : '') +
          (['CREATED', 'ASSEMBLED'].includes(o.status) && !o.incidents?.length
            ? b('inc', 'Сообщить об ошибке', 'd')
            : '')
        );
      }
      const orderStages = [
        ['CREATED', 'Заказ создан'],
        ['ASSEMBLED', 'Заказ собран'],
        ['ISSUED', 'Заказ выдан'],
      ];
      const eventLabels = {
        ...Object.fromEntries(orderStages),
        RETURNED: 'Возврат оформлен',
        ROUTE_CHANGED: 'Маршрут изменён',
        INCIDENT: 'Логистическая ошибка',
      };

      function orderTimeline(order) {
        const history = Array.isArray(order.history) ? order.history.filter(Boolean) : [];
        const events = history.length
          ? [...history]
          : [
              ...(order.created != null ? [{ type: 'CREATED', at: order.created }] : []),
              ...(order.incidents ?? []).map((incident) => ({
                type:
                  incident.from && incident.to && incident.from !== incident.to
                    ? 'ROUTE_CHANGED'
                    : 'INCIDENT',
                at: incident.at,
                detail: [
                  incident.from && incident.to ? incident.from + ' → ' + incident.to : '',
                  incident.extra_cost != null ? '+' + rub(incident.extra_cost) : '',
                  incident.extra_hours != null ? '+' + incident.extra_hours + ' ч' : '',
                ]
                  .filter(Boolean)
                  .join(' · '),
              })),
            ];
        const stages =
          order.status === 'RETURNED'
            ? [...orderStages, ['RETURNED', eventLabels.RETURNED]]
            : orderStages;
        const current = stages.findIndex(([type]) => type === order.status);
        const eventRow = (event, pending = false) => {
          const date = new Date(event.at ?? NaN);
          const knownTime = Number.isFinite(date.getTime());
          const extra = ['ROUTE_CHANGED', 'INCIDENT', 'RETURNED'].includes(event.type);
          return `<li class="order-event ${pending ? 'pending' : extra ? 'exception' : 'complete'}">
            <strong>${esc(Object.hasOwn(eventLabels, event.type) ? eventLabels[event.type] : (event.type ?? 'Событие заказа'))}</strong>
            ${pending ? '<span class="mu">Ожидается</span>' : knownTime ? `<time datetime="${date.toISOString()}">${fd(date)}</time>` : '<span class="mu">Время не указано</span>'}
            ${event.detail ? `<span class="mu">${esc(event.detail)}</span>` : ''}
          </li>`;
        };
        if (current >= 0 && !events.some((event) => event.type === order.status))
          events.push({ type: order.status });
        const pending = current < 0 ? [] : stages.slice(current + 1);
        return `<section class="order-history"><h4>История заказа</h4>
          ${events.length || pending.length ? `<ol>${events.map((event) => eventRow(event)).join('')}${pending.map(([type]) => eventRow({ type }, true)).join('')}</ol>` : '<p class="mu">События пока недоступны.</p>'}
        </section>`;
      }

      function orderListRows() {
        const pvzView = UI.role === 'P';
        const { query, status, point } = UI.orderFilters[UI.role];
        const text = query.trim().toLocaleLowerCase('ru-RU');
        const selectedPoint = pvzView ? UI.pvz : point;
        return DB.orders.filter((order) => {
          const target = order.target ?? order.target_pvz_id;
          return (
            (!selectedPoint || target === selectedPoint || order.source_pvz_id === selectedPoint) &&
            (!status || order.status === status) &&
            (!text ||
              String(order.id).toLowerCase().includes(text) ||
              String(it(order.item)?.name ?? order.item ?? '')
                .toLocaleLowerCase('ru-RU')
                .includes(text))
          );
        });
      }

      function orderListContent() {
        const pvzView = UI.role === 'P';
        const orders = orderListRows();
        if (!orders.length) return '<p class="mu" role="status">Заказы не найдены.</p>';
        return `<div class="tw"><table><thead><tr><th>ID</th><th>Товар</th>${pvzView ? '' : '<th>ПВЗ</th>'}<th>Статус</th><th>Схема</th><th>Стоимость</th><th>Срок</th><th>Действия</th></tr></thead>
          <tbody>${orders.map((order) => orderRow(order, pvzView)).join('')}</tbody></table></div>`;
      }

      function orderList() {
        const pvzView = UI.role === 'P';
        const filter = UI.orderFilters[UI.role];
        return `<section class="c order-list">
          <h3>${pvzView ? 'Заказы на этом ПВЗ' : 'Мои заказы'}</h3>
          <div class="row order-filters">
            <label>Поиск заказов<input type="search" data-order-filter="query" placeholder="Товар или ID" value="${esc(filter.query)}"></label>
            <label>Статус<select data-order-filter="status">
              <option value="">Все статусы</option>
              ${opt(
                [...orderStages, ['RETURNED', eventLabels.RETURNED]].map(([id, name]) => ({
                  id,
                  name,
                })),
                filter.status,
                (status) => status.name,
              )}
            </select></label>

        }
        render();
        if (action === 'sel' || action === 'openExample') {
          $('#order-tracker')?.scrollIntoView({ block: 'start' });
        }
      });
      function scen() {
        seed();
        UI.log = [];
        UI.used = new Set();
        const P = (n) => DB.pvz.find((p) => p.name.includes(n)),
          I = (n) => DB.items.find((i) => i.name === n),
          k = uid;
        const st = (i, p) =>
            sum(
              DB.batches.filter((b) => b.item === i.id && b.pvz === p.id),
              (b) => b.qty,
            ),
          S = [],
          step = (a, t, ok, d) => a.push({ t, ok, d });
        const m2 = P('Москва-2'),
          m3 = P('Москва-3'),
          spb = P('СПб'),
          cup = I('Кружка'),
          jk = I('Куртка'),
          pl = I('Плед');
        let a = [],
          b0 = st(cup, m2);
        let r = call(
            'POST',
            '/orders',
            { item_id: cup.id, qty: 2, target_pvz_id: m3.id, preference: 'COST' },
            k(),
          ),
          o = r.data;
        step(
          a,
          `Заказ ${sh(o.id)} создан: ${o.chosen}, ${rub(o.cost)}, ${Number(o.hours).toFixed(1)} ч`,
          o.chosen === 'MESH',
          'Внутри города mesh дешевле хаба (' + rub(o.base) + '). ' + o.reason,
        );
        const key = k();
        call('POST', `/orders/${o.id}/assemble`, {}, key);
        const r2 = call('POST', `/orders/${o.id}/assemble`, {}, key);
        const r3 = call('POST', `/orders/${o.id}/assemble`, {}, k());
        step(
          a,
          'Сборка идемпотентна: повтор с тем же ключом и с новым ключом',
          st(cup, m2) === b0 - 2 && r2.replay && r3.data.replay,
          `Остаток ${m2.name}: до ${b0}, после ${st(cup, m2)} (списано один раз)`,
        );
        call('POST', `/orders/${o.id}/issue`, {}, k());
        step(
          a,
          'Выдача покупателю',
          o.status === 'ISSUED',
          'Статус: ' + o.status + ', выручка ' + rub(o.price),
        );
        S.push({ t: '1. Городской заказ', st: a });
        a = [];
        r = call(
          'POST',
          '/orders',
          { item_id: jk.id, qty: 10, target_pvz_id: spb.id, preference: 'TIME' },
          k(),
        );
        const h = r.data;
        step(
          a,
          `Заказ ${sh(h.id)}: ${h.chosen}, ${rub(h.cost)}, ${h.hours.toFixed(1)} ч`,
          h.chosen === 'HUB_TRUNK',
          'Mesh: ' + rub(h.variants.mesh.cost) + ' · хаб: ' + rub(h.variants.hub.cost),
        );
        step(
          a,
          'Вызваны заглушки хаба и магистрали',
          UI.used.has('POST /stub/hub/handle') && UI.used.has('POST /stub/trunk/move'),
          'Магистраль = chargeable_kg × км × 0.12, ставка — допущение',
        );
        S.push({ t: '2. Хаб и магистраль', st: a });
        a = [];
        const rb = st(cup, m3);
        call('POST', `/orders/${o.id}/return`, {}, k());
        step(
          a,
          'Возврат выданного заказа',
          o.status === 'RETURNED',
          `Остаток ${m3.name}: до ${rb}, после ${st(cup, m3)}; сторно выдачи ${rub(-pv(m3.id).fis)}`,
        );
        step(
          a,
          'Повторный возврат отклонён',
          call('POST', `/orders/${o.id}/return`, {}, k()).status === 409,
          'Статус-гард',
        );
        S.push({ t: '3. Возврат', st: a });
        a = [];
        r = call(
          'POST',
          '/orders',
          { item_id: cup.id, qty: 1, target_pvz_id: m3.id, preference: 'COST' },
          k(),
        );
        const e = r.data,
          c0 = e.cost;
        const ri = call('POST', '/incidents', { order_id: e.id, type: 'WRONG_PVZ' }, k());
        step(
          a,
          `Ошибка по заказу ${sh(e.id)}: ${ri.data.from} → ${ri.data.to}`,
          ri.status === 200,
          `Стоимость ${rub(c0)} → ${rub(e.cost)} (+${rub(ri.data.extra_cost)}), срок после переназначения: ${e.hours.toFixed(1)} ч`,
        );
        step(
          a,
          'Уведомление об ошибке на ПВЗ',
          DB.notes.some((n) => n.type === 'ERROR'),
          'Раздел «Уведомления»',
        );
        S.push({ t: '4. Логистическая ошибка', st: a });
        a = [];
        call('POST', `/pvz/${m2.id}/intake`, { item_id: pl.id, qty: 5 }, k());
        const l0 = sum(
          DB.ledger.filter((l) => l.kind === 'storage'),
          (l) => l.amt,
        );
        call('POST', '/system/time/advance', { days: 10 }, k());
        const l1 = sum(
          DB.ledger.filter((l) => l.kind === 'storage'),
          (l) => l.amt,
        );
        step(a, 'Время сдвинуто на 10 суток', DB.off === 10 * DAY, 'Системное время: ' + fd(now()));
        step(a, 'Начислено хранение', l1 > l0, `Хранение: до ${rub(l0)}, после ${rub(l1)}`);
        step(
          a,
          'Уведомление «долгое хранение»',
          DB.notes.some((n) => n.type === 'LONG_STORAGE'),
          'Партии старше 7 суток',
        );
        S.push({ t: '5. Длительное хранение', st: a });
        return S;
      }
      const themeToggle = $('#theme-toggle');
      const root = document.documentElement;
      themeToggle.setAttribute('aria-pressed', String(root.dataset.theme === 'dark'));
      themeToggle.addEventListener('click', () => {
        const dark = root.dataset.theme !== 'dark';
        root.dataset.theme = dark ? 'dark' : 'light';
        themeToggle.setAttribute('aria-pressed', String(dark));
        try {
          localStorage.setItem('mesh-pvz-theme', root.dataset.theme);
        } catch {
          // The theme remains active in this tab.
        }
      });

      if (apiBase) {
        const refreshButton = document.createElement('button');
        refreshButton.className = 'b';
        refreshButton.dataset.a = 'refresh';
        refreshButton.textContent = 'Обновить данные';
        document.querySelector('header').append(refreshButton);
        document
          .querySelectorAll('[data-a="reset"], [data-a="nokey"]')
          .forEach((button) => button.remove());
        refresh(true);
      } else {
        seed();
        render();
      }
    </script>
  </body>
</html>
